name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # One job per check, named as WORKFLOW-STANDARD names them, so a red tick says
  # which check failed and a ruleset can require each one. Format is missing:
  # the repository has no Prettier yet, and adopting it reformats 37 files.
  #
  # kern is pinned to a commit and pnpm fetches it as a codeload tarball over
  # HTTPS, so no key, token or URL rewrite is needed.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm run lint
      # House style does not use an em dash. Ratcheted against a baseline, as in
      # kern: new ones fail, and existing ones can only come down.
      - name: Prose
        run: pnpm run lint:prose

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The unit suite renders in jsdom, which has no layout and no colour, so
  # contrast, focus visibility and the worker are only checked here, in a real
  # browser against the production build.
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: pnpm --filter web exec playwright install chromium --with-deps
      - run: pnpm run e2e
      - name: Keep the trace when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  build:
    name: Build
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # kern is pinned to a commit and pnpm fetches it as a codeload tarball
      # over HTTPS, so no key, token or URL rewrite is needed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build


      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=tokenise --branch=main --commit-dirty=true

      # A green deploy is not evidence the site changed. gray-scott served a
      # nineteen-day-old build while CI, the deploy job and the URL were all
      # green: the custom domain sat on a second Pages project that this
      # workflow was not deploying to, and nothing compared the two. The entry
      # hash is the cheapest thing that can tell them apart, because Vite
      # renames it on any content change.
      - name: Verify the live site serves this build
        run: |
          BUILT=$(ls apps/web/dist/assets | grep -E '^index-.*\.js$' | head -1)
          echo "built: $BUILT"
          for i in $(seq 1 10); do
            LIVE=$(curl -fsSL --max-time 20 "$SITE" | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1 || true)
            echo "attempt $i, live: ${LIVE:-none}"
            [ "$LIVE" = "$BUILT" ] && echo "live site matches this build" && exit 0
            sleep 15
          done
          echo "::error::$SITE serves ${LIVE:-nothing}, expected $BUILT."
          echo "::error::The deploy reported success, so the domain is bound to a different Pages project."
          exit 1
        env:
          SITE: https://tokenise.hipuku.dev
